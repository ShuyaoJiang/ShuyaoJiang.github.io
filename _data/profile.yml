short_bio: >-
  <p>
    I am a Research Fellow at <a href="https://www.nus.edu.sg/">National University of Singapore</a>, working with <a href="https://abhikrc.com/">Prof. Abhik Roychoudhury</a>. 
    I received my Ph.D. in Computer Science and Engineering from <a href="https://www.cuhk.edu.hk/">The Chinese University of Hong Kong</a>, supervised by <a href="https://www.cse.cuhk.edu.hk/lyu/">Prof. Michael R. Lyu</a>.
    Prior to that, I obtained both my B.Sc. and M.Eng. degrees in Computer Science from <a href="https://www.fudan.edu.cn/">Fudan University</a>, supervised by <a href="https://www.y-droid.com/yz/">Prof. Yangfan Zhou</a>.
  </p>
  <p>
    My research interests include <span class="research-interest-highlight">Software Testing and Debugging</span>, <span class="research-interest-highlight">Program Analysis</span>, <span class="research-interest-highlight">Runtime Systems</span>, and <span class="research-interest-highlight">AI4SE</span>.
    Currently, I am exploring how to leverage trustworthy AI techniques to support the testing and optimization of emerging software systems (e.g., WebAssembly).
  </p>
  <p style="margin-top: 0.75rem; padding: 0.65rem 0.85rem; border-left: 4px solid #e57373; border-radius: 6px; background: #fff5f5; color: #b23a48;">
    <b>🚀 I am actively seeking faculty positions in Software Engineering. If you are aware of any relevant opportunities, please feel free to contact me.</b>
  </p>

